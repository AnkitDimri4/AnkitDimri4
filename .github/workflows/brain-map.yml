name: Brain map

# The README's brain map is a picture of the live brain map page. This re-takes it every day (and
# whenever it's run by hand from the Actions tab) and commits any change, so the README follows the
# live page.
on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, every day
  workflow_dispatch:

permissions:
  contents: write

# One group with the Portfolio card workflow: both commit to main, so they never push at once
concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh from the live page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/brain-map.mjs
      - name: Commit any change
        run: |
          git add README.md assets/brain-map-light.png assets/brain-map-dark.png assets/live-button-light.png assets/live-button-dark.png
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Brain map: refresh from the live page"
          git pull --rebase --quiet
          git push
